<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#090d14">
<title>Trading P&L Tracker</title>
<style>
:root{--bg:#090d14;--panel:#111a27;--panel2:#151f2e;--line:#28384b;--text:#f1f5fb;--muted:#91a0b5;--green:#20d69a;--red:#ff647c;--blue:#168cff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,sans-serif;padding:18px;max-width:1000px;margin:auto}
header{padding:12px 0 18px;border-bottom:1px solid var(--line);margin-bottom:18px}
h1{font-size:25px;margin:0 0 7px}
.sub{color:var(--muted);font-size:12px;letter-spacing:1px}
h2{font-size:18px;margin:0 0 14px}
h3{font-size:15px;margin:20px 0 10px}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:18px 0}
.card,.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:15px}
.card small{color:var(--muted);font-size:12px}
.card strong{display:block;font-size:22px;margin-top:8px}
.green{color:var(--green)!important}
.red{color:var(--red)!important}
.muted{color:var(--muted)}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
button{border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:11px 13px;border-radius:9px;font-weight:700;font-size:13px}
button.primary{background:var(--blue);border-color:var(--blue);color:white}
button.danger{color:var(--red);border-color:#663444}
button.smallbtn{padding:7px 9px;font-size:11px}
.panel{margin:14px 0}
label{display:block;font-size:12px;color:#aab7c9;margin:11px 0 6px}
input,select{width:100%;padding:12px;background:#0b121d;color:var(--text);border:1px solid #34465c;border-radius:9px;font-size:14px;min-height:43px}
input:focus,select:focus{outline:1px solid var(--blue);border-color:var(--blue)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 10px}
.full{grid-column:1/-1}
.hidden{display:none!important}
.member-list{display:grid;gap:8px}
.member-row,.trade{background:#0d1521;border:1px solid var(--line);border-radius:10px;padding:12px}
.member-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.trade-top{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.trade p{font-size:12px;color:var(--muted);margin:8px 0}
.trade-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
.pill{font-size:10px;padding:5px 8px;border-radius:20px;background:#26374c;color:#d9e7f8}
.empty{padding:20px;text-align:center;color:var(--muted);font-size:13px;border:1px dashed var(--line);border-radius:10px}
.section-title{display:flex;justify-content:space-between;align-items:center;gap:10px}
#notice{color:var(--green);font-size:12px;min-height:16px}
@media(min-width:650px){
.cards{grid-template-columns:repeat(4,minmax(0,1fr))}
.grid{grid-template-columns:repeat(3,minmax(0,1fr))}
}
</style>
</head>

<body>

<header>
<h1>Trading P&amp;L Tracker</h1>
<div class="sub">PERSONAL TRADING DASHBOARD</div>
</header>

<div class="cards">
<div class="card"><small>Total P&amp;L</small><strong id="totalPnl">₹0.00</strong></div>
<div class="card"><small>Closed Trades</small><strong id="closedCount">0</strong></div>
<div class="card"><small>Profit</small><strong class="green" id="profitTotal">₹0.00</strong></div>
<div class="card"><small>Loss</small><strong class="red" id="lossTotal">₹0.00</strong></div>
</div>

<div class="actions">
<button class="primary" onclick="togglePanel('memberPanel')">＋ Add Member</button>
<button class="primary" onclick="openTradeForm()">＋ Add Trade</button>
<button onclick="exportBackup()">Backup</button>
<button onclick="document.getElementById('restoreFile').click()">Restore</button>
<input id="restoreFile" type="file" accept="application/json,.json" class="hidden" onchange="restoreBackup(event)">
</div>

<div id="notice"></div>

<section class="panel hidden" id="memberPanel">
<h2>Add New Member</h2>
<label>Member Name</label>
<input id="newMemberName" type="text" maxlength="80" placeholder="Enter member name">

<div class="actions">
<button class="primary" onclick="addMember()">Save Member</button>
<button onclick="togglePanel('memberPanel',false)">Cancel</button>
</div>

<h3>Member List</h3>
<div id="memberList" class="member-list"></div>
</section>

<section class="panel hidden" id="tradePanel">
<h2 id="tradeFormTitle">New Trade</h2>
<input id="editTradeId" type="hidden">

<div class="grid">

<div><label>Date</label><input id="tradeDate" type="date"></div>

<div><label>Member</label><select id="tradeMember"></select></div>

<div><label>Instrument</label>
<select id="instrument">
<option>NIFTY</option>
<option>BANKNIFTY</option>
<option>SENSEX</option>
<option>STOCKS</option>
<option>FUTURES</option>
<option>GOLD</option>
<option>SILVER</option>
<option>OTHER</option>
</select>
</div>

<div><label>Type</label>
<select id="tradeType">
<option>CE</option>
<option>PE</option>
<option>FUTURES</option>
<option>STOCK</option>
<option>OTHER</option>
</select>
</div>

<div><label>Position</label>
<select id="position">
<option>BUY</option>
<option>SELL</option>
</select>
</div>

<div><label>Strike / Symbol</label><input id="strike" placeholder="Strike price or symbol"></div>

<div><label>Expiry</label><input id="expiry" type="date"></div>

<div><label>Entry Price</label><input id="entry" type="number" min="0" step="0.01" placeholder="0.00"></div>

<div><label>Exit Price (keep blank if open)</label><input id="exit" type="number" min="0" step="0.01" placeholder="Blank = Open"></div>

<div><label>Lots / Quantity</label><input id="lots" type="number" min="0.01" step="0.01" value="1"></div>

<div><label>Lot Size</label><input id="lotSize" type="number" min="0.01" step="0.01" value="1"></div>

<div><label>Charges</label><input id="charges" type="number" min="0" step="0.01" value="0"></div>

<div class="full"><label>Notes</label><input id="notes" placeholder="Optional notes"></div>

</div>

<div class="actions">
<button class="primary" onclick="saveTrade()">Save Trade</button>
<button onclick="closeTradeForm()">Cancel</button>
</div>
</section>

<section class="panel">
<div class="section-title">
<h2>Member-wise P&amp;L</h2>
<span class="muted" id="memberCount">0 members</span>
</div>
<div id="memberSummary" class="member-list"></div>
</section>

<section class="panel">
<div class="section-title">
<h2>Trade History</h2>
<span class="muted" id="tradeCount">0 trades</span>
</div>

<div class="grid">
<div>
<label>Filter Member</label>
<select id="filterMember" onchange="renderTrades()">
<option value="">All Members</option>
</select>
</div>

<div>
<label>Trade Status</label>
<select id="filterStatus" onchange="renderTrades()">
<option value="">All Trades</option>
<option value="OPEN">Open</option>
<option value="CLOSED">Closed</option>
</select>
</div>
</div>

<div id="tradeHistory" class="member-list" style="margin-top:12px"></div>
</section>

<script>

const STORAGE_KEY = "kaleen_trading_pl_tracker_v1";

let data = {
members:[],
trades:[]
};

function loadData(){
try{
const saved = localStorage.getItem(STORAGE_KEY);

if(saved){
const parsed = JSON.parse(saved);

data.members = Array.isArray(parsed.members) ? parsed.members : [];
data.trades = Array.isArray(parsed.trades) ? parsed.trades : [];
}

}catch(e){
alert("Saved data could not be read. Please restore from your backup if available.");
}
}

function persist(){
localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
renderAll();
}

function money(n){
return "₹" + (Number(n)||0).toLocaleString("en-IN",{
minimumFractionDigits:2,
maximumFractionDigits:2
});
}

function safeText(s){
return String(s??"").replace(/[&<>"']/g,c=>({
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#39;"
}[c]));
}

function tradeStatus(t){
return t.exit===null || t.exit==="" ? "OPEN" : "CLOSED";
}

function tradePnl(t){

if(tradeStatus(t)==="OPEN") return 0;

const direction=t.position==="BUY"?1:-1;

return (
(Number(t.exit)-Number(t.entry))
* direction
* Number(t.lots)
* Number(t.lotSize)
) - Number(t.charges||0);

}

function showNotice(msg){

const n=document.getElementById("notice");
n.textContent=msg;

setTimeout(()=>{
if(n.textContent===msg)n.textContent="";
},2500);

}

function togglePanel(id,force){

const el=document.getElementById(id);

if(force===false){
el.classList.add("hidden");
}else{
el.classList.toggle("hidden");
}

}

function addMember(){

const input=document.getElementById("newMemberName");
const name=input.value.trim();

if(!name){
alert("Please enter a member name.");
return;
}

if(data.members.some(m=>m.toLowerCase()===name.toLowerCase())){
alert("This member already exists.");
return;
}

data.members.push(name);
input.value="";

persist();
showNotice("Member added successfully.");

}

function deleteMember(index){

const name=data.members[index];

if(data.trades.some(t=>t.member===name)){
alert("This member has trade records. Delete those trades first.");
return;
}

if(confirm("Delete member "+name+"?")){
data.members.splice(index,1);
persist();
}

}

function renderMembers(){

const box=document.getElementById("memberList");

document.getElementById("memberCount").textContent=data.members.length+" members";

box.innerHTML=data.members.length
?data.members.map((m,i)=>`
<div class="member-row">
<strong>${safeText(m)}</strong>
<button class="danger smallbtn" onclick="deleteMember(${i})">Delete</button>
</div>
`).join("")
:'<div class="empty">No members added yet.</div>';

const opts=data.members.map(m=>`
<option value="${safeText(m)}">${safeText(m)}</option>
`).join("");

document.getElementById("tradeMember").innerHTML=
opts || '<option value="">Add a member first</option>';

const filter=document.getElementById("filterMember");
const old=filter.value;

filter.innerHTML='<option value="">All Members</option>'+opts;

if(data.members.includes(old)){
filter.value=old;
}

}

function openTradeForm(){

if(!data.members.length){
alert("Please add a member first.");
document.getElementById("memberPanel").classList.remove("hidden");
return;
}

document.getElementById("tradePanel").classList.remove("hidden");

document.getElementById("tradePanel").scrollIntoView({
behavior:"smooth"
});

}

function closeTradeForm(){

document.getElementById("tradePanel").classList.add("hidden");
resetTradeForm();

}

function resetTradeForm(){

document.getElementById("editTradeId").value="";
document.getElementById("tradeFormTitle").textContent="New Trade";

["strike","expiry","entry","exit","notes"].forEach(id=>{
document.getElementById(id).value="";
});

document.getElementById("tradeDate").value=new Date().toISOString().slice(0,10);

document.getElementById("lots").value="1";
document.getElementById("lotSize").value="1";
document.getElementById("charges").value="0";

document.getElementById("instrument").value="NIFTY";
document.getElementById("tradeType").value="CE";
document.getElementById("position").value="BUY";

}

function saveTrade(){

const member=document.getElementById("tradeMember").value;
const entry=document.getElementById("entry").value;
const exitValue=document.getElementById("exit").value;

const lots=Number(document.getElementById("lots").value);
const lotSize=Number(document.getElementById("lotSize").value);

if(!member){
alert("Select a member.");
return;
}

if(entry===""||Number(entry)<0){
alert("Enter a valid entry price.");
return;
}

if(exitValue!==""&&Number(exitValue)<0){
alert("Exit price cannot be negative.");
return;
}

if(!(lots>0)||!(lotSize>0)){
alert("Lots and lot size must be greater than zero.");
return;
}

const id=document.getElementById("editTradeId").value;

const trade={

id:id||String(Date.now())+Math.random().toString(16).slice(2),

date:document.getElementById("tradeDate").value,

member,

instrument:document.getElementById("instrument").value,

type:document.getElementById("tradeType").value,

position:document.getElementById("position").value,

strike:document.getElementById("strike").value.trim(),

expiry:document.getElementById("expiry").value,

entry:Number(entry),

exit:exitValue===""?null:Number(exitValue),

lots,

lotSize,

charges:Number(document.getElementById("charges").value)||0,

notes:document.getElementById("notes").value.trim()

};

if(id){

const i=data.trades.findIndex(t=>t.id===id);

if(i>=0)data.trades[i]=trade;

}else{

data.trades.unshift(trade);

}

persist();
closeTradeForm();
showNotice("Trade saved successfully.");

}

function editTrade(id){

const t=data.trades.find(x=>x.id===id);

if(!t)return;

document.getElementById("tradePanel").classList.remove("hidden");

document.getElementById("tradeFormTitle").textContent="Edit Trade";

const fields={

editTradeId:t.id,
tradeDate:t.date,
tradeMember:t.member,
instrument:t.instrument,
tradeType:t.type,
position:t.position,
strike:t.strike,
expiry:t.expiry,
entry:t.entry,
exit:t.exit??"",
lots:t.lots,
lotSize:t.lotSize,
charges:t.charges,
notes:t.notes

};

Object.entries(fields).forEach(([k,v])=>{
document.getElementById(k).value=v??"";
});

document.getElementById("tradePanel").scrollIntoView({
behavior:"smooth"
});

}

function deleteTrade(id){

if(confirm("Delete this trade permanently?")){

data.trades=data.trades.filter(t=>t.id!==id);

persist();

showNotice("Trade deleted.");

}

}

function closeOpenTrade(id){

const t=data.trades.find(x=>x.id===id);

if(!t)return;

const value=prompt("Enter exit price:");

if(value===null)return;

if(value.trim()===""||!Number.isFinite(Number(value))||Number(value)<0){

alert("Enter a valid exit price.");
return;

}

t.exit=Number(value);

persist();

showNotice("Trade closed.");

}

function renderDashboard(){

const closed=data.trades.filter(t=>tradeStatus(t)==="CLOSED");

const total=closed.reduce((s,t)=>s+tradePnl(t),0);

const profit=closed.reduce((s,t)=>s+Math.max(0,tradePnl(t)),0);

const loss=closed.reduce((s,t)=>s+Math.min(0,tradePnl(t)),0);

const el=document.getElementById("totalPnl");

el.textContent=money(total);
el.className=total>=0?"green":"red";

document.getElementById("closedCount").textContent=closed.length;

document.getElementById("profitTotal").textContent=money(profit);

document.getElementById("lossTotal").textContent=money(loss);

}

function renderMemberSummary(){

const box=document.getElementById("memberSummary");

if(!data.members.length){

box.innerHTML='<div class="empty">No members yet. Tap Add Member to begin.</div>';

return;

}

box.innerHTML=data.members.map(m=>{

const trades=data.trades.filter(t=>t.member===m);

const closed=trades.filter(t=>tradeStatus(t)==="CLOSED");

const pnl=closed.reduce((s,t)=>s+tradePnl(t),0);

const open=trades.filter(t=>tradeStatus(t)==="OPEN").length;

return `
<div class="member-row">

<div>
<strong>${safeText(m)}</strong>
<div class="muted" style="font-size:11px;margin-top:5px">
${trades.length} trades · ${open} open
</div>
</div>

<strong class="${pnl>=0?'green':'red'}">${money(pnl)}</strong>

</div>
`;

}).join("");

}

function renderTrades(){

const member=document.getElementById("filterMember").value;

const status=document.getElementById("filterStatus").value;

let list=data.trades.filter(t=>
(!member||t.member===member)&&
(!status||tradeStatus(t)===status)
);

document.getElementById("tradeCount").textContent=list.length+" trades";

const box=document.getElementById("tradeHistory");

if(!list.length){

box.innerHTML='<div class="empty">No trades found.</div>';

return;

}

box.innerHTML=list.map(t=>{

const st=tradeStatus(t);
const pnl=tradePnl(t);

return `
<article class="trade">

<div class="trade-top">
<strong>${safeText(t.instrument)} ${safeText(t.type)} ${safeText(t.position)}</strong>
<span class="pill">${st}</span>
</div>

<p>${safeText(t.member)} · ${safeText(t.date||"No date")} · ${safeText(t.strike||"No strike")}</p>

<p>Entry: ${money(t.entry)} · Exit: ${st==="OPEN"?"Open":money(t.exit)}</p>

<p>Lots: ${t.lots} × Lot Size: ${t.lotSize} · Charges: ${money(t.charges)}</p>

<p>Expiry: ${safeText(t.expiry||"Not set")} ${t.notes?"· "+safeText(t.notes):""}</p>

<div class="trade-top">
<strong class="${st==="OPEN"?"muted":pnl>=0?"green":"red"}">
${st==="OPEN"?"P&L: Open":money(pnl)}
</strong>
</div>

<div class="trade-actions">

${st==="OPEN"?`<button class="primary smallbtn" onclick="closeOpenTrade('${t.id}')">Close Trade</button>`:""}

<button class="smallbtn" onclick="editTrade('${t.id}')">Edit</button>

<button class="danger smallbtn" onclick="deleteTrade('${t.id}')">Delete</button>

</div>

</article>
`;

}).join("");

}

function renderAll(){

renderMembers();
renderDashboard();
renderMemberSummary();
renderTrades();

}

function exportBackup(){

const blob=new Blob(
[JSON.stringify(data,null,2)],
{type:"application/json"}
);

const url=URL.createObjectURL(blob);

const a=document.createElement("a");

a.href=url;

a.download="trading-pl-backup-"+new Date().toISOString().slice(0,10)+".json";

a.click();

URL.revokeObjectURL(url);

showNotice("Backup downloaded.");

}

function restoreBackup(event){

const file=event.target.files[0];

if(!file)return;

const reader=new FileReader();

reader.onload=()=>{

try{

const parsed=JSON.parse(reader.result);

if(!Array.isArray(parsed.members)||!Array.isArray(parsed.trades)){
throw new Error("Invalid backup");
}

if(confirm("Restore backup? Current app data will be replaced.")){

data={
members:parsed.members,
trades:parsed.trades
};

persist();

showNotice("Backup restored.");

}

}catch(e){

alert("Invalid backup file.");

}

event.target.value="";

};

reader.readAsText(file);

}

loadData();
resetTradeForm();
renderAll();

</script>
</body>
</html>
